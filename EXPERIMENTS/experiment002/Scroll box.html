<!doctype html>
<html lang="en">
    <head>
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>A scroll box</title>
        <style>
            body {
                display: flex;
                justify-content: center;
            }
            div {
                margin: 0;
            }
            .flex-vertical {
                display: flex;
                flex-direction: column;
                height: 70px;
                width: 350px;
                background-color: #393939;
                border-radius: 8px;
                padding-left: 5px;
                padding-right: 5px;
                padding-top: 5px;
            }
            .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            img {
                height: 20px;
                object-fit: cover;
            }
            .text {
                color: white;
                font-weight: bold;
            }
            .scroll {
                width: 100%;
                overflow-x: scroll;
                white-space: nowrap;
                color: #c99100;
                font-size: 15px;
            }
        </style>
    </head>
    <body>
        <div class="flex-vertical">
            <div class="header">
                <div class="text">CSS</div>
                <div class="icon"><img src="Star.svg" /></div>
            </div>
            <div class="scroll">
                ullamco veniam magna nisi pariatur mollit <br />minim laborum
                sint Lorem esse eu tempor ea qui tempor mollit ad ea ex
            </div>
        </div>
    </body>
</html>
