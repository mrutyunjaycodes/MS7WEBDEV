<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>experimental</title>
        <style>
            body {
                background-color: #e1e0dc;
            }
            input {
                margin-left: 20px;
                background-color: #e1e0dc;
                width: 250px;
                border-style: solid;
                border-color: #e1e0dc;
                border-width: 8px;
                border-radius: 30px;
                box-shadow:
                    2px 1px 2px #00000061,
                    inset 3px 2px 3px #00000061,
                    inset -2px -2px 3px #ffffff82,
                    -2px -2px 2px #ffffff82;
                padding: 10px;
            }
            input::placeholder {
                color: black;
            }
            input:focus {
                outline: none;
            }
        </style>
    </head>
    <body>
        <input type="text" placeholder="Search for local businesses" />
    </body>
</html>
