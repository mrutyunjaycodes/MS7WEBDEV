<!DOCTYPE html>
<html>
  <head>
    <title>Registration form</title>
  </head>
  <body>
    <form action="ASSIGNMENT011.html" method="post">
      <b>Registration form</b><br />
      <label for="username">
        NAME:
      </label>
      <input type="text" placeholder="ex: John Doe" name="username" id="username"/><br />
      <b>Gender:</b>
      <input type="radio" name="gender" value="male" id="male"/>
      <label for="male">
        Male
      </label>
      <input type="radio" name="gender" value="female" id="female"/>
      <label for="female">Female
      </label><br />
      <b>Skills:</b><br />
      <input type="checkbox" name="Skill1" value="HTML" id="Skill1" checked/>
      <!-- when using for attribute in label make sure the id remains unique for labelable elements you are using -->
      <label for="Skill1">
        HTML
      </label><br>
      <input type="checkbox" name="Skill2" value="C++" id="Skill2"/>
      <label for="Skill2">
        C++
      </label><br>
      <input type="checkbox" name="Skill3" value="CSS" id="Skill3" checked/>
      <label for="Skill3">
        CSS
      </label><br>
      <input type="checkbox" name="Skill4" value="Python" id="Skill4" checked/>
      <label for="Skill4">
        PYTHON
      </label><br>
      <input type="checkbox" name="Skill5" value="JAVASCRIPT" id="Skill5"/>
      <label for="Skill5">
        JAVASCRIPT
      </label><br>
      <input type="checkbox" name="Skill6" value="JAVA" id="Skill6"/>
      <label for="Skill6">
        JAVA
      </label><br>
      <input type="checkbox" name="Skill7" value="C" id="Skill7" checked/>
      <label for="Skill7">
        C
      </label><br>
      <input type="checkbox" name="Skill8" value="SQL" id="Skill8" checked/>
      <label for="Skill8">
        SQL
      </label><br>
      <!-- <input type="submit" name="SUBMIT" id="SUBMIT" value="SUBMIT" /> -->
    </form>
  </body>
</html>
