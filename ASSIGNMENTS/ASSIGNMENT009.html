<!DOCTYPE html>
<html>
  <head>
    <title>Registration form</title>
  </head>
  <body>
    <!-- used post method -->
    <!-- action was set to a local html file so that error foe doesn't appear while submitting -->
    <form action="ASSIGNMENT008.html" method="POST">
      <b>Registration form</b><br />
      <label for="username">Name: </label><br>
      <input
        type="text"
        name="username"
        placeholder="ex: John Doe"
        id="username"
      /><br />
      <label for="mobile">Mobile no: </label><br>
      <input
        type="number"
        name="mobile"
        placeholder="ex: 5377388297"
        id="mobile"
      /><br />
      <label for="email">Email: </label><br>
      <input
        type="email"
        name="email"
        placeholder="ex: example@gmail.com"
        id="email"
      /><br />
      <label for="password">Password: </label><br>
      <input
        type="password"
        name="password"
        placeholder="ex: 124@7ya"
        id="password"
      /><br>
      <input type="submit" name="submit" id="submit" value="SUBMIT" />
    </form>
  </body>
</html>
