<!DOCTYPE html>
<html>
  <head>
    <title>Text Formatting and Links</title>
  </head>
  <body>
    <h1>HTML Text Formatting &amp Links Demo</h1>
    <p><b>Bold Text:</b> This text is bold.</p>
    <p><i>Italic Text:</i> This text is italic.</p>
    <p><u>Underlined Text:</u> This text is underlined.</p>
    <hr>
    <h2>Anchor Tag Examples</h2>
    <p><a href="https://www.google.com">Visit Google (Same Tab)</a></p>
    <p><a href="https://www.wikipedia.org" target="_blank">Visit Wikipedia (New Tab)</a></p>
  </body>
</html>
