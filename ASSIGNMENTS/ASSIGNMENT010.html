<!DOCTYPE html>
<html>
  <head>
    <title>Registration form</title>
  </head>
  <body>
    <form action="ASSIGNMENT010.html" method="get">
      <b>Registration form</b><br />
      <label>
        NAME:
        <input type="text" placeholder="ex: John Doe" name="username"/>
      </label><br />
      <b>Gender:</b>
      <label>
        <input type="radio" name="gender" value="male"/>Male
      </label>
      <label>
        <input type="radio" name="gender" value="female"/>Female
      </label><br />
      <b>Skills:</b><br />
      <!-- we didn't use for in label, also we have given same name to every checkbox element. this will create an array of skill. -->
      <label>
        <input type="checkbox" name="Skill" value="HTML" checked/>HTML
      </label><br>
      <label>
        <input type="checkbox" name="Skill" value="C++"/>C++
      </label><br>
      <label>
        <input type="checkbox" name="Skill" value="CSS" checked/>CSS
      </label><br>
      <label>
        <input type="checkbox" name="Skill" value="Python" checked/>PYTHON
      </label><br>
      <label>
        <input type="checkbox" name="Skill" value="JAVASCRIPT"/>JAVASCRIPT
      </label><br>
      <label>
        <input type="checkbox" name="Skill" value="JAVA"/>JAVA
      </label><br>
      <label>
        <input type="checkbox" name="Skill" value="C" checked/>C
      </label><br>
      <label>
        <input type="checkbox" name="Skill" value="SQL" checked/>SQL
      </label><br>
      <!-- <input type="submit" name="SUBMIT" id="SUBMIT" value="SUBMIT" /> -->
    </form>
  </body>
</html>
