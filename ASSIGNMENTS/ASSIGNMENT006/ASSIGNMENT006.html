<!DOCTYPE html>
<html>
  <head>
    <title>Nested List Example</title>
  </head>
  <body>
    <h1>Nested List Example</h1>
    <h2>Fruits and Their Types</h2>
    <ul>
      <li>
        Fruits
        <ol>
          <li>
            Apple
            <ol type="a" start="3">
              <li>Red Apple</li>
              <li>Green Apple</li>
            </ol>
          </li>
          <li>
            Banana
            <ol type="i" start="2">
              <li>Yellow Banana</li>
              <li>Green Banana</li>
            </ol>
          </li>
        </ol>
      </li>
      <li>
        Vegetables
        <ol>
          <li>Carrot</li>
          <li>Potato</li>
        </ol>
      </li>
    </ul>
    <a
      href="https://4.bp.blogspot.com/-iCWLv2hDiXM/UM6yuDEIsQI/AAAAAAAAAHk/v2IFZwwqxUE/s1600/Fruits+and+Vegetables+(1).jpg">
      <img src="image.jpg" alt="vegetable" width="300px" />
    </a>
  </body>
</html>
