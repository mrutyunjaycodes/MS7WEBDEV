<!DOCTYPE html>
<html>
    <head>
        <title>Nested List Example</title>
    </head>
    <body>
        <h1>Nested List Example</h1>
        <h2>Fruits and Their Types</h2>
        <ul>
            <li>
                Fruits
                <ol>
                    <li>
                        Apple
                        <ol type="a" start="3">
                            <li>Red Apple</li>
                            <li>Green Apple</li>
                        </ol>
                    </li>
                    <li>
                        Banana
                        <ol type="i" start="2">
                            <li>Yellow Banana</li>
                            <li>Green Banana</li>
                        </ol>
                    </li>
                </ol>
            </li>
            <li>
                Vegetables
                <ol>
                    <li>Carrot</li>
                    <li>Potato</li>
                </ol>
            </li>
        </ul>
        <img src="image.jpg" alt="vegetable" width="300px" />
    </body>
</html>
